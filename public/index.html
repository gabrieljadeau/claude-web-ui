<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Web UI</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1c1a; --muted: #6f6c66; --line: #e3e0da;
    --accent: #c4633f; --accent-ink: #ffffff; --soft: #efece6; --danger: #b3261e; --ok: #2e7d32;
    --code: #f1efea; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1a18; --panel: #24231f; --ink: #ecebe7; --muted: #a29f97; --line: #38362f;
      --soft: #2d2b27; --code: #2d2b27; --shadow: none; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.55 "Segoe UI", system-ui, -apple-system, sans-serif;
    display: grid; grid-template-columns: 270px 1fr; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }

  /* Sidebar */
  aside { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .brand { padding: 16px 16px 8px; font-weight: 600; letter-spacing: .2px; display: flex; align-items: center; gap: 8px; }
  .brand i { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); display: inline-block; }
  .side-btn { margin: 4px 12px; padding: 9px 12px; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; text-align: left; }
  .side-btn:hover { background: var(--soft); }
  .folder { margin: 8px 12px; padding: 8px 10px; background: var(--soft); border-radius: 10px; font-size: 13px; }
  .folder .label { color: var(--muted); font-size: 12px; }
  .folder .path { word-break: break-all; }
  .folder button { margin-top: 6px; border: 0; background: none; color: var(--accent); padding: 0; font-size: 13px; }
  .sessions-title { padding: 12px 16px 4px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .6px; }
  #sessions { overflow-y: auto; flex: 1; padding: 0 8px 12px; }
  .sess { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 8px; font-size: 14px; }
  .sess:hover { background: var(--soft); }
  .sess.active { background: var(--soft); font-weight: 600; }
  .sess small { display: block; color: var(--muted); font-size: 12px; font-weight: 400; }
  .sess span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Main */
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100vh; }
  header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 18px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header label { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  header select, header input[type=text] { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 5px 8px; }
  .toggle { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink); }
  .spacer { flex: 1; }
  #status { font-size: 12px; color: var(--muted); }
  #status.bad { color: var(--danger); }

  #chat { flex: 1; overflow-y: auto; padding: 24px 0 12px; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 0 20px; }
  .msg { margin: 0 0 18px; }
  .msg.user .bubble { background: var(--soft); border-radius: 14px; padding: 10px 14px; display: inline-block; max-width: 100%; white-space: pre-wrap; }
  .msg.user { text-align: right; }
  .msg.user .bubble { text-align: left; }
  .msg.assistant .bubble { padding: 2px 2px; }
  .bubble p { margin: 0 0 10px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble pre { background: var(--code); padding: 10px 12px; border-radius: 8px; overflow-x: auto; font-size: 13px; }
  .bubble code { background: var(--code); padding: 1px 4px; border-radius: 4px; font-family: Consolas, ui-monospace, monospace; font-size: 13px; }
  .bubble pre code { background: none; padding: 0; }
  .bubble ul, .bubble ol { margin: 0 0 10px; padding-left: 22px; }
  .bubble h1, .bubble h2, .bubble h3 { font-size: 16px; margin: 14px 0 6px; }
  .bubble a { color: var(--accent); }

  .tool { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; margin: 8px 0; font-size: 13px; }
  .tool summary { padding: 7px 10px; cursor: pointer; display: flex; gap: 8px; align-items: center; list-style: none; }
  .tool summary::-webkit-details-marker { display: none; }
  .tool .name { font-weight: 600; }
  .tool .arg { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; font-family: Consolas, ui-monospace, monospace; }
  .tool .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .tool.ok .dot { background: var(--ok); } .tool.err .dot { background: var(--danger); }
  .tool pre { margin: 0; padding: 8px 10px; border-top: 1px solid var(--line); white-space: pre-wrap; word-break: break-word; max-height: 320px; overflow: auto; font-size: 12px; font-family: Consolas, ui-monospace, monospace; }

  .perm { border: 1.5px solid var(--accent); background: var(--panel); border-radius: 12px; padding: 12px 14px; margin: 10px 0; box-shadow: var(--shadow); }
  .perm .q { font-weight: 600; margin-bottom: 6px; }
  .perm pre { background: var(--code); border-radius: 8px; padding: 8px 10px; font-size: 12px; white-space: pre-wrap; word-break: break-word; max-height: 220px; overflow: auto; margin: 0 0 10px; }
  .perm .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .perm.done { border-color: var(--line); opacity: .75; box-shadow: none; }
  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn:disabled { opacity: .5; cursor: default; }
  .note { color: var(--muted); font-size: 13px; margin: 6px 0 16px; }
  .note.err { color: var(--danger); }
  .empty { text-align: center; color: var(--muted); margin-top: 18vh; }
  .empty h2 { color: var(--ink); font-weight: 600; margin-bottom: 6px; }

  /* Composer */
  .composer { padding: 10px 0 16px; }
  .box { border: 1px solid var(--line); background: var(--panel); border-radius: 16px; box-shadow: var(--shadow); padding: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 4px 6px; }
  .chips:empty { display: none; }
  .chip { background: var(--soft); border-radius: 999px; padding: 3px 4px 3px 10px; font-size: 12px; display: flex; align-items: center; gap: 4px; }
  .chip.loading { opacity: .6; }
  .chip button { border: 0; background: none; padding: 0 6px; color: var(--muted); }
  textarea { width: 100%; border: 0; outline: none; resize: none; background: transparent; padding: 6px 8px; min-height: 44px; max-height: 240px; }
  .row { display: flex; align-items: center; gap: 6px; }
  .icon { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; width: 36px; height: 36px; display: grid; place-items: center; padding: 0; }
  .icon svg { width: 18px; height: 18px; }
  .icon.rec { background: var(--danger); border-color: var(--danger); color: #fff; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .65; } }
  #send { margin-left: auto; }
  .row select { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px; font-size: 13px; }
  #interim { color: var(--muted); font-style: italic; font-size: 13px; padding: 0 8px; }

  /* Drop overlay & dialog */
  #drop { position: fixed; inset: 0; background: rgba(196,99,63,.12); border: 3px dashed var(--accent); display: none; place-items: center; font-size: 20px; font-weight: 600; color: var(--accent); z-index: 50; pointer-events: none; }
  body.dragging #drop { display: grid; }
  dialog { border: 1px solid var(--line); border-radius: 14px; padding: 0; width: min(560px, 92vw); background: var(--panel); color: var(--ink); }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  .dlg-head { padding: 14px 16px; border-bottom: 1px solid var(--line); font-weight: 600; }
  .dlg-path { padding: 8px 16px; font-size: 13px; color: var(--muted); word-break: break-all; }
  #dirs { max-height: 50vh; overflow-y: auto; padding: 4px 8px; }
  #dirs button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 8px; }
  #dirs button:hover { background: var(--soft); }
  .dlg-foot { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 16px; border-top: 1px solid var(--line); }

  @media (max-width: 760px) { body { grid-template-columns: 1fr; } aside { display: none; } }
</style>
</head>
<body>
<aside>
  <div class="brand"><i></i> Claude Web UI</div>
  <button class="side-btn" id="newChat">+ New chat</button>
  <div class="folder">
    <div class="label">Working folder</div>
    <div class="path" id="cwd">…</div>
    <button id="changeFolder">Change folder</button>
  </div>
  <div class="sessions-title">History</div>
  <div id="sessions"></div>
</aside>

<main>
  <header>
    <label>Model
      <select id="model">
        <option value="">Default</option>
        <option value="opus">Opus</option>
        <option value="sonnet">Sonnet</option>
        <option value="haiku">Haiku</option>
        <option value="__custom">Custom ID…</option>
      </select>
    </label>
    <label>Mode
      <select id="mode">
        <option value="default">Ask before changes</option>
        <option value="acceptEdits">Auto-accept file edits</option>
        <option value="plan">Plan only (no changes)</option>
      </select>
    </label>
    <label class="toggle"><input type="checkbox" id="browser" checked> Browser actions</label>
    <label class="toggle"><input type="checkbox" id="speak"> Read replies aloud</label>
    <span class="spacer"></span>
    <span id="status">Connecting…</span>
  </header>

  <div id="chat"><div class="wrap" id="log"></div></div>

  <div class="composer"><div class="wrap">
    <div class="box">
      <div class="chips" id="chips"></div>
      <textarea id="input" rows="1" placeholder="Message Claude… (Enter to send, Shift+Enter for a new line, drop files anywhere)"></textarea>
      <div id="interim"></div>
      <div class="row">
        <button class="icon" id="attach" title="Attach files">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.5l-8.6 8.6a5.5 5.5 0 01-7.8-7.8l9.2-9.2a3.7 3.7 0 015.2 5.2l-9.2 9.2a1.8 1.8 0 01-2.6-2.6l8.5-8.5"/></svg>
        </button>
        <input type="file" id="fileInput" multiple hidden>
        <button class="icon" id="mic" title="Talk (click to start / stop)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>
        </button>
        <select id="lang" title="Voice language">
          <option value="fr-FR">Français</option>
          <option value="es-ES">Español</option>
          <option value="en-US">English</option>
        </select>
        <button class="btn primary" id="send">Send</button>
      </div>
    </div>
  </div></div>
</main>

<div id="drop">Drop files to attach</div>

<dialog id="folderDlg">
  <div class="dlg-head">Choose the working folder</div>
  <div class="dlg-path" id="dlgPath"></div>
  <div id="dirs"></div>
  <div class="dlg-foot">
    <button class="btn" id="dlgCancel">Cancel</button>
    <button class="btn primary" id="dlgChoose">Use this folder</button>
  </div>
</dialog>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const token = new URLSearchParams(location.search).get('t');
  const store = {
    get(k, d) { try { const v = localStorage.getItem('cwui.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('cwui.' + k, JSON.stringify(v)); } catch {} },
  };

  let ws, busy = false, sessionId = null, cwd = '', live = null, lastAssistantText = '';
  const tools = new Map();          // tool_use id -> details element
  const attachments = [];           // {ref, name, path|null}

  // ---------- connection ----------
  function connect() {
    ws = new WebSocket(`ws://${location.host}/ws?t=${encodeURIComponent(token || '')}`);
    ws.onopen = () => setStatus('Connected');
    ws.onclose = () => { setStatus('Disconnected — is the terminal window still open? Retrying…', true); setBusy(false); setTimeout(connect, 2500); };
    ws.onmessage = (e) => handle(JSON.parse(e.data));
  }
  const send = (obj) => ws && ws.readyState === 1 && ws.send(JSON.stringify(obj));
  function setStatus(t, bad) { $('status').textContent = t; $('status').classList.toggle('bad', !!bad); }

  function pushSettings() {
    const sel = $('model').value;
    const model = sel === '__custom' ? store.get('customModel', '') : sel;
    send({ type: 'settings', mode: $('mode').value, browser: $('browser').checked, model });
  }

  // ---------- incoming ----------
  function handle(m) {
    switch (m.type) {
      case 'hello': {
        pushSettings();
        const saved = store.get('cwd', null);
        if (saved && saved !== m.cwd) send({ type: 'setCwd', path: saved }); else setCwd(m.cwd);
        break;
      }
      case 'cwd': setCwd(m.cwd); store.set('cwd', m.cwd); break;
      case 'session':
        sessionId = m.id;
        if (!m.id) clearLog();
        markActiveSession();
        break;
      case 'busy':
        setBusy(m.value);
        if (!m.value) { finalizeLive(); send({ type: 'sessions' }); }
        break;
      case 'delta':
        if (!live) live = addAssistant('');
        live.raw += m.text; live.el.innerHTML = md(live.raw); scrollDown();
        break;
      case 'assistantText':
        if (!live) live = addAssistant('');
        live.raw = m.text; live.el.innerHTML = md(m.text);
        lastAssistantText = m.text;
        live = null; scrollDown();
        break;
      case 'toolUse': finalizeLive(); addTool(m); break;
      case 'toolResult': {
        const d = tools.get(m.id); if (!d) break;
        d.classList.add(m.isError ? 'err' : 'ok');
        const pre = document.createElement('pre'); pre.textContent = m.content || '(no output)'; d.appendChild(pre);
        break;
      }
      case 'permission': addPermission(m); break;
      case 'done':
        if (!m.ok && m.message) note(m.message, true);
        else if (m.cost != null) note(`Done · $${m.cost.toFixed(4)}`);
        if ($('speak').checked && lastAssistantText) speak(lastAssistantText);
        break;
      case 'error': note(m.message, true); break;
      case 'sessions': renderSessions(m.items); break;
      case 'history': clearLog(); for (const h of m.items) {
          if (h.role === 'user') addUser(h.text);
          else { if (h.text) addAssistant(h.text); if (h.tools?.length) note('Used: ' + h.tools.join(', ')); }
        } scrollDown(); break;
      case 'ls': renderDirs(m); break;
      case 'uploaded': {
        const a = attachments.find((x) => x.ref === m.ref);
        if (a) { a.path = m.path; renderChips(); }
        break;
      }
    }
  }

  // ---------- chat rendering ----------
  const log = $('log');
  function clearLog() {
    log.innerHTML = ''; tools.clear(); live = null;
    log.innerHTML = '<div class="empty"><h2>What should we work on?</h2><div>Claude works in the folder shown on the left. Type, talk, or drop files.</div></div>';
  }
  function dropEmpty() { const e = log.querySelector('.empty'); if (e) e.remove(); }
  function addUser(text) {
    dropEmpty();
    const d = document.createElement('div'); d.className = 'msg user';
    const b = document.createElement('div'); b.className = 'bubble'; b.textContent = text;
    d.appendChild(b); log.appendChild(d); scrollDown();
  }
  function addAssistant(text) {
    dropEmpty();
    const d = document.createElement('div'); d.className = 'msg assistant';
    const b = document.createElement('div'); b.className = 'bubble'; b.innerHTML = md(text);
    d.appendChild(b); log.appendChild(d);
    return { el: b, raw: text };
  }
  function finalizeLive() { if (live && !live.raw.trim()) live.el.parentElement.remove(); live = null; }
  function note(text, err) {
    const d = document.createElement('div'); d.className = 'note' + (err ? ' err' : ''); d.textContent = text;
    log.appendChild(d); scrollDown();
  }
  function toolArg(input) {
    if (!input || typeof input !== 'object') return '';
    return input.command || input.file_path || input.url || input.pattern || input.path || input.query || input.element || input.description || JSON.stringify(input).slice(0, 160);
  }
  function prettyTool(name) {
    if (name.startsWith('mcp__browser__')) return 'Browser · ' + name.slice(14).replace(/^browser_/, '').replace(/_/g, ' ');
    return name;
  }
  function addTool(m) {
    dropEmpty();
    const d = document.createElement('details'); d.className = 'tool';
    const s = document.createElement('summary');
    s.innerHTML = '<span class="dot"></span><span class="name"></span><span class="arg"></span>';
    s.querySelector('.name').textContent = prettyTool(m.name);
    s.querySelector('.arg').textContent = toolArg(m.input);
    d.appendChild(s); log.appendChild(d); tools.set(m.id, d); scrollDown();
  }
  function addPermission(m) {
    dropEmpty();
    const d = document.createElement('div'); d.className = 'perm';
    const q = document.createElement('div'); q.className = 'q';
    q.textContent = `Claude wants to use ${prettyTool(m.tool)}`;
    const pre = document.createElement('pre');
    pre.textContent = typeof m.input === 'object' ? JSON.stringify(m.input, null, 2) : String(m.input);
    const btns = document.createElement('div'); btns.className = 'btns';
    const mk = (label, cls, allow, always) => {
      const b = document.createElement('button'); b.className = 'btn ' + cls; b.textContent = label;
      b.onclick = () => {
        send({ type: 'permit', id: m.id, tool: m.tool, allow, always });
        d.classList.add('done'); btns.querySelectorAll('button').forEach((x) => (x.disabled = true));
        q.textContent += allow ? ' — allowed' : ' — refused';
      };
      return b;
    };
    btns.append(
      mk('Allow', 'primary', true, false),
      mk(m.tool.startsWith('mcp__browser__') ? 'Allow all browser actions' : 'Always allow in this chat', '', true, true),
      mk('Refuse', '', false, false),
    );
    d.append(q, pre, btns); log.appendChild(d); scrollDown();
  }
  function scrollDown() { const c = $('chat'); c.scrollTop = c.scrollHeight; }

  // Minimal, safe Markdown (escape first, then format).
  function esc(s) { return s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  function inline(s) {
    return s
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>')
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  }
  function md(src) {
    const parts = String(src || '').split(/```/);
    let html = '';
    parts.forEach((part, i) => {
      if (i % 2 === 1) { html += '<pre><code>' + esc(part.replace(/^[^\n]*\n/, '')) + '</code></pre>'; return; }
      const lines = esc(part).split('\n');
      let list = null, para = [];
      const flushPara = () => { if (para.length) { html += '<p>' + inline(para.join('<br>')) + '</p>'; para = []; } };
      const flushList = () => { if (list) { html += `</${list}>`; list = null; } };
      for (const line of lines) {
        let m;
        if ((m = line.match(/^\s*#{1,3}\s+(.*)/))) { flushPara(); flushList(); html += '<h3>' + inline(m[1]) + '</h3>'; }
        else if ((m = line.match(/^\s*[-*]\s+(.*)/))) { flushPara(); if (list !== 'ul') { flushList(); html += '<ul>'; list = 'ul'; } html += '<li>' + inline(m[1]) + '</li>'; }
        else if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) { flushPara(); if (list !== 'ol') { flushList(); html += '<ol>'; list = 'ol'; } html += '<li>' + inline(m[1]) + '</li>'; }
        else if (!line.trim()) { flushPara(); flushList(); }
        else { flushList(); para.push(line); }
      }
      flushPara(); flushList();
    });
    return html;
  }

  // ---------- sending ----------
  function setBusy(v) {
    busy = v;
    $('send').textContent = v ? 'Stop' : 'Send';
    $('send').classList.toggle('primary', !v);
    ['model', 'mode', 'browser', 'newChat', 'changeFolder'].forEach((id) => ($(id).disabled = v));
    if (v) setStatus('Working…'); else if (ws?.readyState === 1) setStatus('Connected');
  }
  function submit() {
    if (busy) { send({ type: 'stop' }); return; }
    if (attachments.some((a) => !a.path)) { note('Files are still uploading — one moment.'); return; }
    const text = $('input').value.trim();
    if (!text && !attachments.length) return;
    const files = attachments.map((a) => a.path);
    const shown = text + (attachments.length ? `\n📎 ${attachments.map((a) => a.name).join(', ')}` : '');
    addUser(shown);
    send({ type: 'send', text: text || 'Please look at the attached files.', files });
    $('input').value = ''; autosize();
    attachments.length = 0; renderChips();
    lastAssistantText = '';
    if (recognizing) recognition.stop();
  }
  $('send').onclick = submit;
  $('input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); }
  });
  function autosize() { const t = $('input'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 240) + 'px'; }
  $('input').addEventListener('input', autosize);

  // ---------- attachments (drag & drop + picker) ----------
  function renderChips() {
    const c = $('chips'); c.innerHTML = '';
    for (const a of attachments) {
      const chip = document.createElement('span'); chip.className = 'chip' + (a.path ? '' : ' loading');
      chip.textContent = a.name + (a.path ? '' : ' (uploading…)');
      const x = document.createElement('button'); x.textContent = '×'; x.title = 'Remove';
      x.onclick = () => { attachments.splice(attachments.indexOf(a), 1); renderChips(); };
      chip.appendChild(x); c.appendChild(chip);
    }
  }
  function addFiles(list) {
    for (const f of list) {
      if (f.size > 25 * 1024 * 1024) { note(`${f.name} is larger than 25 MB.`, true); continue; }
      const ref = Math.random().toString(36).slice(2);
      attachments.push({ ref, name: f.name, path: null }); renderChips();
      const r = new FileReader();
      r.onload = () => send({ type: 'upload', ref, name: f.name, data: String(r.result).split(',')[1] || '' });
      r.readAsDataURL(f);
    }
  }
  $('attach').onclick = () => $('fileInput').click();
  $('fileInput').onchange = (e) => { addFiles(e.target.files); e.target.value = ''; };
  let dragDepth = 0;
  window.addEventListener('dragenter', (e) => { if (e.dataTransfer?.types?.includes('Files')) { dragDepth++; document.body.classList.add('dragging'); } });
  window.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
  window.addEventListener('dragover', (e) => e.preventDefault());
  window.addEventListener('drop', (e) => {
    e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging');
    if (e.dataTransfer?.files?.length) addFiles(e.dataTransfer.files);
  });
  window.addEventListener('paste', (e) => { const f = e.clipboardData?.files; if (f?.length) { e.preventDefault(); addFiles(f); } });

  // ---------- voice ----------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null, recognizing = false, baseText = '';
  $('lang').value = store.get('lang', 'fr-FR');
  $('lang').onchange = () => { store.set('lang', $('lang').value); if (recognition) recognition.lang = $('lang').value; };
  if (!SR) { $('mic').disabled = true; $('mic').title = 'Voice input needs Microsoft Edge or Google Chrome'; }
  else {
    recognition = new SR();
    recognition.continuous = true; recognition.interimResults = true;
    recognition.onstart = () => { recognizing = true; $('mic').classList.add('rec'); baseText = $('input').value; };
    recognition.onend = () => { recognizing = false; $('mic').classList.remove('rec'); $('interim').textContent = ''; };
    recognition.onerror = (e) => { if (e.error === 'not-allowed') note('Microphone access was blocked. Allow it in the address bar (lock icon) and try again.', true); };
    recognition.onresult = (e) => {
      let finalText = '', interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript;
      }
      if (finalText) { baseText = (baseText ? baseText.replace(/\s*$/, ' ') : '') + finalText.trim(); $('input').value = baseText; autosize(); }
      $('interim').textContent = interim;
    };
    $('mic').onclick = () => {
      if (recognizing) { recognition.stop(); return; }
      speechSynthesis?.cancel();
      recognition.lang = $('lang').value;
      try { recognition.start(); } catch {}
    };
  }
  function speak(text) {
    if (!window.speechSynthesis) return;
    const plain = text.replace(/```[\s\S]*?```/g, ' (code) ').replace(/[`*#>_]/g, '').replace(/\[([^\]]+)\]\([^)]+\)/g, '$1');
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(plain.slice(0, 4000));
    u.lang = $('lang').value;
    speechSynthesis.speak(u);
  }

  // ---------- settings ----------
  $('mode').value = store.get('mode', 'default');
  $('browser').checked = store.get('browser', true);
  $('speak').checked = store.get('speak', false);
  const savedModel = store.get('model', '');
  $('model').value = [...$('model').options].some((o) => o.value === savedModel) ? savedModel : '';
  if (savedModel === '__custom') $('model').options[4].textContent = 'Custom: ' + store.get('customModel', '');
  $('model').onchange = () => {
    if ($('model').value === '__custom') {
      const id = prompt('Model ID (for example an Amazon Bedrock model or inference profile ID):', store.get('customModel', ''));
      if (!id) { $('model').value = store.get('model', '') === '__custom' ? '__custom' : ''; }
      else { store.set('customModel', id.trim()); $('model').options[4].textContent = 'Custom: ' + id.trim(); }
    }
    store.set('model', $('model').value); pushSettings();
  };
  $('mode').onchange = () => { store.set('mode', $('mode').value); pushSettings(); };
  $('browser').onchange = () => { store.set('browser', $('browser').checked); pushSettings(); };
  $('speak').onchange = () => { store.set('speak', $('speak').checked); if (!$('speak').checked) speechSynthesis?.cancel(); };

  // ---------- sessions & folder ----------
  function setCwd(p) { cwd = p; $('cwd').textContent = p; send({ type: 'sessions' }); clearLog(); sessionId = null; }
  function renderSessions(items) {
    const box = $('sessions'); box.innerHTML = '';
    if (!items.length) { box.innerHTML = '<div class="note" style="padding:0 10px">No chats in this folder yet.</div>'; return; }
    for (const s of items) {
      const b = document.createElement('button'); b.className = 'sess'; b.dataset.id = s.id;
      const t = document.createElement('span'); t.textContent = s.title;
      const w = document.createElement('small'); w.textContent = s.when ? new Date(s.when).toLocaleString() : '';
      b.append(t, w);
      b.onclick = () => { if (!busy) send({ type: 'openSession', id: s.id }); };
      box.appendChild(b);
    }
    markActiveSession();
  }
  function markActiveSession() {
    document.querySelectorAll('.sess').forEach((b) => b.classList.toggle('active', b.dataset.id === sessionId));
  }
  $('newChat').onclick = () => { if (!busy) send({ type: 'newChat' }); };

  let dlgCurrent = null;
  $('changeFolder').onclick = () => { send({ type: 'ls', path: cwd }); $('folderDlg').showModal(); };
  $('dlgCancel').onclick = () => $('folderDlg').close();
  $('dlgChoose').onclick = () => { if (dlgCurrent && dlgCurrent !== 'drives') send({ type: 'setCwd', path: dlgCurrent }); $('folderDlg').close(); };
  function renderDirs(m) {
    dlgCurrent = m.path;
    $('dlgPath').textContent = m.path === 'drives' ? 'This PC' : m.path;
    $('dlgChoose').disabled = m.path === 'drives';
    const box = $('dirs'); box.innerHTML = '';
    const add = (label, p) => { const b = document.createElement('button'); b.textContent = label; b.onclick = () => send({ type: 'ls', path: p }); box.appendChild(b); };
    if (m.parent) add('⬆  Up', m.parent);
    if (m.home && m.path !== m.home) add('🏠  Home', m.home);
    for (const d of m.dirs) add('📁  ' + d.name, d.path);
    if (!m.dirs.length) box.insertAdjacentHTML('beforeend', '<div class="note" style="padding:6px 10px">No subfolders.</div>');
  }

  clearLog();
  connect();
})();
</script>
</body>
</html>
